name: Kiểm tra và đóng gói
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chuẩn bị pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node scripts/scan-secrets.mjs
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Chuẩn bị audio backend ảo cho browser Linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=device_lab_qa rate=48000 channels=2 channel_map=front-left,front-right
          pactl set-default-sink device_lab_qa
          pactl info
          pactl list short sinks
          node scripts/smoke-audio.mjs
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Lưu bằng chứng QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            artifacts/playwright/
            artifacts/audio-smoke/
            playwright-report/
            test-results/
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Docker smoke — build, health, Nginx, VI/EN, restart/shutdown
        run: bash scripts/docker-smoke.sh
      - name: Lưu bằng chứng Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-docker-qa
          path: artifacts/docker/
