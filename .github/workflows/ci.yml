name: Kiểm tra và đóng gói
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chuẩn bị pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node scripts/scan-secrets.mjs
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Docker smoke — build, health, Nginx, VI/EN, restart/shutdown
        run: bash scripts/docker-smoke.sh
      - name: Lưu bằng chứng QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-qa
          path: |
            artifacts/docker/
            playwright-report/
            test-results/
