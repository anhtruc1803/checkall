services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    image: device-lab:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost}
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
networks:
  web:
